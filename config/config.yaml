# Configuration file for GZSL Skeleton Action Recognition

# Dataset configuration
dataset:
  name: "ntu60"  # ntu60, ntu120, ucf101, pku_mmd
  data_dir: "./data/ntu60/"
  data_file: null  # Optional explicit preprocessed NPZ.
  num_classes: 60
  num_joints: 25
  split:
    seen: 55
    unseen: 5

# Model configuration
model:
  backbone: "shift-gcn"
  feature_dim: 512
  num_parts: 6  # Head, Torso, Left Arm, Right Arm, Left Leg, Right Leg
  temporal_window: 10
  dropout: 0.5

# Text encoder configuration
text_encoder:
  clip_model: "ViT-B/32"
  freeze_clip: True

# Skeleton encoder configuration
skeleton_encoder:
  shift_gcn_pretrained: null  # Set only to a checkpoint trained on this class split.

# Training configuration
training:
  batch_size: 64
  num_epochs: 80
  learning_rate: 0.0001
  weight_decay: 0.0005
  scheduler: "cosine"

  # Loss weights
  lambda_p: 1.0  # Primitive-level alignment
  lambda_g: 1.0  # Global-level alignment
  lambda_c: 0.5  # Consistency loss
  lambda_d: 0.1  # Primitive decorrelation

  # Temperature for contrastive loss
  temperature: 0.07

  # Device
  device: "cuda"
  num_workers: 4

# Released prompt resources
prompt:
  template_path: "./prompts/prompt_template.md"
  descriptions_dir: "./data/prompts/"
  body_parts:
    - "head"
    - "torso"
    - "left arm"
    - "right arm"
    - "left leg"
    - "right leg"

# Evaluation
evaluation:
  metrics: ["acc_s", "acc_u", "hm"]

# Logging
logging:
  log_dir: "./logs/"
  checkpoint_dir: "./checkpoints/"
